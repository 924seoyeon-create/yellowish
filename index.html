<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>노릇노릇</title>
<meta name="description" content="해야 할 일을 지금 하게 만드는 앱, 노릇노릇">
<meta name="theme-color" content="#EA580C">
<meta property="og:type" content="website">
<meta property="og:title" content="노릇노릇">
<meta property="og:description" content="해야 할 일을 지금 하게 만드는 앱, 노릇노릇">
<meta property="og:url" content="https://924seoyeon-create.github.io/yellowish/">
<meta property="og:image" content="https://924seoyeon-create.github.io/yellowish/icons/icon-512.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="노릇노릇">
<meta name="twitter:description" content="해야 할 일을 지금 하게 만드는 앱, 노릇노릇">
<meta name="twitter:image" content="https://924seoyeon-create.github.io/yellowish/icons/icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="노릇노릇">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="pre-launch">

  <!-- HOME (홈) -->
  <section id="screen-splash" aria-label="홈">
    <button class="splash-log" id="splash-log" aria-label="오늘의 작업 보기">
      <span aria-hidden="true">🪵</span>
    </button>
    <p class="splash-tagline">오늘도 발등은<br>노릇노릇 익어가는 중</p>
  </section>

  <header class="appheader">
    <div class="brand" id="brand-home-btn" role="button" tabindex="0" aria-label="첫 화면으로"><span class="brand-icon" aria-hidden="true">🔥</span>노릇노릇</div>
    <button class="add-task-fab" id="header-add-btn" aria-label="새 작업 추가">+</button>
  </header>

  <main class="screens">

    <!-- TODAY (오늘) -->
    <section class="screen" id="screen-home" aria-label="오늘">
      <div id="home-content"></div>
    </section>

    <!-- ADD TASK -->
    <section class="screen" id="screen-add-task" aria-label="작업 추가">
      <div class="backrow" id="add-task-back" tabindex="0" role="button" aria-label="뒤로 가기">← 뒤로</div>
      <h1 class="screen-title" id="add-task-title">무엇을 해야 하나요?</h1>
      <form id="task-form">
        <div class="field">
          <label for="f-title">할 일</label>
          <input type="text" id="f-title" placeholder="예: 보고서 초안 작성" autocomplete="off" required>
        </div>
        <div class="field">
          <label for="f-next">다음 행동 <span style="opacity:.6;font-weight:400;">(선택)</span></label>
          <input type="text" id="f-next" placeholder="예: 첫 번째 문단 작성하기" autocomplete="off">
        </div>
        <div class="field">
          <label>마감 <span style="opacity:.6;font-weight:400;">(선택)</span></label>
          <div class="deadline-picker-row">
            <button type="button" class="deadline-date-btn" id="f-deadline-date-btn">📅 날짜 선택</button>
          </div>
          <div class="time-picker-row">
            <select id="f-deadline-ampm" aria-label="오전/오후">
              <option value="AM">오전</option>
              <option value="PM">오후</option>
            </select>
            <select id="f-deadline-hour" aria-label="시">
              <option value="1">1시</option>
              <option value="2">2시</option>
              <option value="3">3시</option>
              <option value="4">4시</option>
              <option value="5">5시</option>
              <option value="6">6시</option>
              <option value="7">7시</option>
              <option value="8">8시</option>
              <option value="9">9시</option>
              <option value="10">10시</option>
              <option value="11">11시</option>
              <option value="12">12시</option>
            </select>
            <select id="f-deadline-minute" aria-label="분">
              <option value="00">00분</option>
              <option value="05">05분</option>
              <option value="10">10분</option>
              <option value="15">15분</option>
              <option value="20">20분</option>
              <option value="25">25분</option>
              <option value="30">30분</option>
              <option value="35">35분</option>
              <option value="40">40분</option>
              <option value="45">45분</option>
              <option value="50">50분</option>
              <option value="55">55분</option>
            </select>
          </div>
          <div class="deadline-clear" id="f-deadline-clear" hidden>마감일 지우기</div>
        </div>
        <div class="field">
          <label>중요도</label>
          <div class="radio-group" role="radiogroup" aria-label="중요도">
            <label><input type="radio" name="importance" value="low"><span>낮음</span></label>
            <label><input type="radio" name="importance" value="medium" checked><span>보통</span></label>
            <label><input type="radio" name="importance" value="high"><span>높음</span></label>
          </div>
        </div>
        <div class="field">
          <label>긴급도</label>
          <div class="radio-group" role="radiogroup" aria-label="긴급도">
            <label><input type="radio" name="urgency" value="1"><span>여유</span></label>
            <label><input type="radio" name="urgency" value="2"><span>보통</span></label>
            <label><input type="radio" name="urgency" value="3" checked><span>주의</span></label>
            <label><input type="radio" name="urgency" value="4"><span>긴급</span></label>
            <label><input type="radio" name="urgency" value="5"><span>매우 긴급</span></label>
          </div>
        </div>
        <div class="field">
          <label for="f-commit">외부 약속 <span style="opacity:.6;font-weight:400;">(선택사항)</span></label>
          <input type="text" id="f-commit" placeholder="선택사항" autocomplete="off">
        </div>
        <div class="field">
          <label for="f-person">결과물을 보여줄 사람 <span style="opacity:.6;font-weight:400;">(선택사항)</span></label>
          <input type="text" id="f-person" placeholder="선택사항" autocomplete="off">
        </div>
        <div class="field">
          <label for="f-stop">오늘의 종료 기준 <span style="opacity:.6;font-weight:400;">(선택사항)</span></label>
          <input type="text" id="f-stop" placeholder="선택사항" autocomplete="off">
        </div>
        <div class="divider"></div>
        <button type="submit" class="btn btn-primary">저장</button>
      </form>
    </section>

    <!-- TASK DETAIL -->
    <section class="screen" id="screen-task-detail" aria-label="작업 상세">
      <div class="backrow" id="detail-back" tabindex="0" role="button" aria-label="오늘로 돌아가기">← 오늘</div>
      <div id="detail-content"></div>
    </section>

    <!-- SHRINE (신내림) -->
    <section class="screen" id="screen-shrine" aria-label="신내림">
      <div class="backrow" id="shrine-back" tabindex="0" role="button" aria-label="오늘로 돌아가기">← 오늘</div>
      <div id="shrine-content" class="shrine-screen"></div>
    </section>

    <!-- SHRINE STOPWATCH (신내림 스톱워치, count-up) -->
    <section class="screen" id="screen-shrine-timer" aria-label="신내림 스톱워치">
      <div class="focus-screen shrine-timer-screen">
        <div class="focus-label"><span class="bell-sm"><img src="icons/sinnaerim.png" alt=""></span> 신내림</div>
        <div class="focus-task" id="shrine-timer-task-name">-</div>
        <div class="focus-time" id="shrine-timer-time" role="timer" aria-live="polite">00:00:00</div>
        <div class="axe-easteregg" id="shrine-axe" hidden>🪓</div>
        <div class="btn-row">
          <button class="btn btn-primary" id="shrine-timer-stop-btn">멈추기</button>
        </div>
      </div>
    </section>

    <!-- FOCUS TIMER (오늘 전용, countdown) -->
    <section class="screen" id="screen-focus" aria-label="집중 타이머">
      <div class="focus-screen">
        <div class="focus-label">지금 시작</div>
        <div class="focus-task" id="focus-task-name">-</div>
        <div class="focus-time" id="focus-time" role="timer" aria-live="polite">00:00</div>
        <div class="progress-track"><div class="progress-fill" id="focus-progress" style="width:0%"></div></div>
        <div class="btn-row">
          <button class="btn btn-secondary" id="focus-pause-btn">일시정지</button>
          <button class="btn btn-primary" id="focus-stop-btn">중단</button>
        </div>
      </div>
    </section>

    <!-- FOCUS COMPLETE -->
    <section class="screen" id="screen-focus-complete" aria-label="집중 종료">
      <div class="complete-screen" id="complete-content"></div>
    </section>

    <!-- OTHER TASKS (다른 작업) -->
    <section class="screen" id="screen-other-tasks" aria-label="다른 작업">
      <div class="backrow" id="other-tasks-back" tabindex="0" role="button" aria-label="오늘로 돌아가기">← 오늘</div>
      <h1 class="screen-title">다른 작업</h1>
      <div id="other-tasks-content"></div>
    </section>

    <!-- CALENDAR (달력) -->
    <section class="screen" id="screen-calendar" aria-label="달력">
      <div class="backrow" id="calendar-back" tabindex="0" role="button" aria-label="돌아가기">← 뒤로</div>
      <div id="calendar-content"></div>
    </section>

    <!-- PATTERN -->
    <section class="screen" id="screen-pattern" aria-label="나의 패턴">
      <div id="pattern-content"></div>
    </section>

  </main>

  <nav class="bottom-nav" id="bottom-nav">
    <button data-nav="home" aria-label="오늘"><span class="icon">🔥</span>오늘</button>
    <button data-nav="shrine" aria-label="신내림"><span class="icon"><img src="icons/sinnaerim.png" alt=""></span>신내림</button>
    <button data-nav="pattern" aria-label="나의 패턴"><span class="icon">📊</span>패턴</button>
  </nav>

</div>

<script src="app.js"></script>
</body>
</html>
